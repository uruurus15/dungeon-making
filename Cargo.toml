[package]
name = "dungeon_making"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dungeon_making"
path = "src/main.rs"

[dependencies]
macroquad = { version = "0.4", default-features = false, features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
resvg = { version = "0.45", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
quad-storage = "0.1"

[build-dependencies]
winres = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
